name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: No debug logging in crypto package
        run: |
          if grep -rEn '(Log\.(d|v)\(|println\()' core/src --include='*.kt' | grep -E '/crypto/'; then
            echo "::error::Debug logging found in :core crypto/ package"
            exit 1
          fi

      - name: Test core
        run: ./gradlew :core:allTests

      - name: Test server
        run: ./gradlew :server:test
