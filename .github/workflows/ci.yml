name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        # These :core test tasks are excluded because `check` wires them in directly
        # (not just via :core:allTests), and they'd run against the JS/wasmJs crypto stub
        # actuals (see core's crypto/ package), which throw until those platforms get real
        # implementations. iOS test tasks aren't listed: they're skipped automatically on
        # this Linux runner via kotlin.native.ignoreDisabledTargets. Tests are run
        # explicitly, per-target, below as each platform's crypto actual lands.
        run: ./gradlew build -x :core:allTests -x :core:jsBrowserTest -x :core:wasmJsBrowserTest

      - name: No debug logging in crypto package
        run: |
          if grep -rEn '(Log\.(d|v)\s*\(|println\s*\()' core/src --include='*.kt' | grep -E '/crypto/'; then
            echo "::error::Debug logging found in :core crypto/ package"
            exit 1
          fi

      - name: Test core (Android)
        run: ./gradlew :core:testAndroidHostTest

      # TODO: add as each target's crypto actual implementation lands (issue #5 follow-ups)
      # - name: Test core (JVM)
      #   run: ./gradlew :core:jvmTest
      # - name: Test core (JS)
      #   run: ./gradlew :core:jsTest
      # - name: Test core (wasmJs)
      #   run: ./gradlew :core:wasmJsTest
      # Once all targets are covered, replace the steps above with:
      #   run: ./gradlew :core:allTests

      - name: Test server
        run: ./gradlew :server:test
